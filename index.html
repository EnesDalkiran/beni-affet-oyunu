<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beni Affet ❤️</title>
  <link rel="stylesheet" href="styleee.css" />
</head>
<body>

  <!-- First tap overlay -->
  <div id="tap-overlay">
    <p>Ekrana dokun ❤️</p>
  </div>

  <!-- Game screen -->
  <main id="game-screen">
    <div id="hearts-container"></div>

    <h1>Beni affet, seni çok seviyorum</h1>

    <div class="buttons-container">
      <button id="btn-runaway">Affetmiyorum</button>
      <button id="btn-accept">Bende seni çok seviyorum, affediyorum</button>
    </div>
  </main>

  <!-- Final screen -->
  <div id="final-screen" class="hidden">
    <h1>❤️ Seni çok seviyorum ❤️</h1>
  </div>

  <!-- Hidden YouTube player -->
  <div id="youtube-player"></div>

  <!-- Scripts -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js" defer></script>
</body>
</html>
