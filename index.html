<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beni Affet ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 🔒 FIRST TAP OVERLAY -->
  <div id="tap-overlay">
    <p>Ekrana dokun ❤️</p>
  </div>

  <!-- ❤️ FLOATING HEARTS -->
  <div id="hearts-container"></div>

  <!-- 🎮 GAME SCREEN -->
  <main id="game-screen">
    <h1>Beni affet, seni çok seviyorum</h1>

    <div class="buttons-container">
      <button id="btn-runaway" type="button">
        Affetmiyorum
      </button>

      <button id="btn-accept" type="button">
        Bende seni çok seviyorum, affediyorum
      </button>
    </div>
  </main>

  <!-- 💖 FINAL SCREEN -->
  <div id="final-screen" class="hidden">
    <h1>❤️ Seni çok seviyorum ❤️</h1>
  </div>

  <!-- 🎵 YOUTUBE PLAYER (HIDDEN) -->
  <div id="youtube-player"></div>

  <!-- SCRIPTS -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js" defer></script>
</body>
</html>
