<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beni Affet ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- First tap overlay -->
  <div id="tap-overlay">
    <p>Ekrana dokun ❤️</p>
  </div>

  <!-- Floating hearts background -->
  <div id="hearts-container"></div>

  <!-- Game screen -->
  <main id="game-screen">
    <h1>Beni affet, seni çok seviyorum</h1>

    <div class="buttons-container">
      <button id="btn-runaway" type="button">
        Affetmiyorum
      </button>

      <button id="btn-accept" type="button">
        Bende seni çok seviyorum, affediyorum
      </button>
    </div>
  </main>

  <!-- Final screen -->
  <div id="final-screen" style="display:none;">
    <h1>❤️ Seni çok seviyorum ❤️</h1>
  </div>

  <!-- Hidden YouTube player -->
  <div id="youtube-player" style="display:none;"></div>

  <!-- Scripts -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
